<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Parcial 2</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      body {
        margin: 0;
        padding: 32px 20px 48px;
        background: radial-gradient(circle at top, #f3f7ff 0%, #ffffff 60%);
        color: #1f2a44;
      }

      main {
        max-width: 640px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 12px 30px rgba(31, 42, 68, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.75rem, 5vw, 3.5rem);
        line-height: 1.1;
        font-weight: 800;
      }

      .meta {
        margin: 0 0 24px;
        color: #4b5b7a;
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      label {
        font-weight: 600;
        display: block;
        margin-bottom: 6px;
      }

      input {
        width: 100%;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        font-size: 1rem;
      }

      button {
        padding: 12px 16px;
        border: none;
        border-radius: 12px;
        background: #1f3a8a;
        color: #ffffff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #1a3276;
      }

      .result {
        font-size: 1.25rem;
        font-weight: 700;
      }

      .error {
        color: #b91c1c;
        min-height: 1.5em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Parcial 2</h1>
      <p class="meta">Nombre: Jeronimo Zapata</p>
      <p class="meta">DNI: 46776574</p>
      <p class="meta">Legajo: 28386</p>

      <section class="grid" aria-labelledby="sum-title">
        <h2 id="sum-title">Calculadora de suma</h2>

        <div>
          <label for="operand-a">Numero A</label>
          <input id="operand-a" type="text" inputmode="decimal" placeholder="Ej: 2.5" />
        </div>

        <div>
          <label for="operand-b">Numero B</label>
          <input id="operand-b" type="text" inputmode="decimal" placeholder="Ej: 3" />
        </div>

        <button id="sum-button" type="button">Calcular suma</button>

        <p id="sum-error" class="error" role="alert" aria-live="polite"></p>
        <p class="result">Resultado: <span id="sum-result">-</span></p>
      </section>
    </main>

    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
