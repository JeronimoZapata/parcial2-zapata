name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-check:
    name: ci-check
    runs-on: ubuntu-latest

    steps:
      # Fetch the repository content for the workflow runner.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
            fetch-depth: 0


      # Install and configure the requested Node.js version with npm cache.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install exact dependency versions from the lockfile.
      - name: Install dependencies
        run: npm ci

      # Run the linter to catch code style and quality issues.
      - name: Run code inspection
        run: npm run lint

      # Execute the test suite to validate behavior.
      - name: Run automated tests
        run: npm test

      # Build the project to ensure production artifacts compile.
      - name: Run local build
        run: npm run build

      # Analyze the code with SonarQube Cloud to identify bugs and vulnerabilities.  
      - name: Run SonarQube Cloud analysis
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  trello-ci-feedback:
    name: trello-ci-feedback
    runs-on: ubuntu-latest
    needs: quality-check
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Trello card ID
        id: trello
        run: |
          CARD_ID=$(node scripts/extract-trello-card-id.mjs "${{ github.event.pull_request.title }}" "${{ github.event.pull_request.body }}" "${{ github.head_ref }}")
          echo "card_id=$CARD_ID" >> "$GITHUB_OUTPUT"

      - name: Comment Trello card when CI fails
        if: needs.quality-check.result != 'success' && steps.trello.outputs.card_id != ''
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_API_TOKEN: ${{ secrets.TRELLO_API_TOKEN }}
          TRELLO_CARD_ID: ${{ steps.trello.outputs.card_id }}
          FEEDBACK_STATUS: ci_failed
        run: node scripts/trello-feedback.mjs

      - name: Comment Trello card when CI passes
        if: needs.quality-check.result == 'success' && steps.trello.outputs.card_id != ''
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_API_TOKEN: ${{ secrets.TRELLO_API_TOKEN }}
          TRELLO_CARD_ID: ${{ steps.trello.outputs.card_id }}
          FEEDBACK_STATUS: ci_passed
        run: node scripts/trello-feedback.mjs

  deploy:
    name: deploy-vercel
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      # Fetch the repository content for the workflow runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the latest Vercel CLI globally for deployment commands.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Sync production environment variables and settings from Vercel.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Build the project using Vercel's build pipeline.
      - name: Build project with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Deploy the prebuilt output to Vercel production.
      - name: Deploy prebuilt project to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  trello-deploy-feedback:
    name: trello-deploy-feedback
    runs-on: ubuntu-latest
    needs:
      - quality-check
      - deploy
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Trello card ID from associated PR
        id: trello
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CARD_ID=$(node scripts/find-associated-pr-trello-card-id.mjs "${{ github.event.head_commit.message }}")
          echo "card_id=$CARD_ID" >> "$GITHUB_OUTPUT"

      - name: Comment Trello card and move to DONE when deploy succeeds
        if: needs.quality-check.result == 'success' && needs.deploy.result == 'success' && steps.trello.outputs.card_id != ''
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_API_TOKEN: ${{ secrets.TRELLO_API_TOKEN }}
          TRELLO_CARD_ID: ${{ steps.trello.outputs.card_id }}
          TRELLO_DONE_LIST_ID: ${{ secrets.TRELLO_DONE_LIST_ID }}
          FEEDBACK_STATUS: deploy_succeeded
        run: node scripts/trello-feedback.mjs

      - name: Comment Trello card when deploy fails
        if: needs.quality-check.result == 'success' && needs.deploy.result != 'success' && steps.trello.outputs.card_id != ''
        env:
          TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
          TRELLO_API_TOKEN: ${{ secrets.TRELLO_API_TOKEN }}
          TRELLO_CARD_ID: ${{ steps.trello.outputs.card_id }}
          FEEDBACK_STATUS: deploy_failed
        run: node scripts/trello-feedback.mjs